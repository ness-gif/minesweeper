<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マインスイーパー</title>
<style>
* {
    margin: 0;
    user-select: none;
    cursor: default;
}

body {
    background-color: black;
    height: 100vh;
    position: relative;
    display: grid;
    place-items: center;
    .board {
        background-color: black;
        border: solid 1px black;
        height: min(90vh, 90vw);
        width: min(90vh, 90vw);
        display: grid;
        grid-template-rows: repeat(10, 1fr);
        row-gap: 1px;
        .row {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            column-gap: 1px;
            .square {
                background-color: white;
                font-size: min(6.2vh, 6.2vw);
                position: relative;
                text-align: center;
                color: black;
            }
            .square.hidden::before {
                content: '';
                inset: 0;
                position: absolute;
                background-color: gray;
            }
            .square.hidden.flagged::before {
                content: '🏳';
                inset: 0;
                position: absolute;
                background-color: gray;
                color: red;
            }
        }
    }
    .message {
        display: none;
        text-align: center;
        position: absolute;
        top: 50%;
        left: 50%;
        translate: -50% -50%;
        .message_text {
            color: blue;
            font-size: min(20vh, 20vw);
        }
        .restart {
            font-size: min(5vh, 5vw);
            color: blue;
            text-decoration: underline;
        }
    }
    .switch {
        position: absolute;
        left: min(5vh, 5vw);
        top: min(5vh, 5vw);
        font-size: min(3.1vh, 3.1vw);
        padding-inline: min(1vh, 1vw);
        border-radius: 5px;
        color: black;
        background-color: white;
    }
    .switch.on {
        color: white;
        background-color: red;
    }
}
</style>
</head>
<body>
    <div class="board"></div>
    <div class="message">
        <div class="message_text">GAME OVER</div>
        <div class="restart" onclick="window.location.reload()">RESTART</div>
    </div>
    <div class="switch" onclick="flag_switch()">FLAG</div>

<script>
let bomb = 10;
let url = new URL(window.location.href);
let params = url.searchParams;
try {
    bomb = Number(params.get('bomb'));
} catch {
    bomb = 10;
}

const board_html = document.querySelector('.board');
const message_html = document.querySelector('.message');
const message_text_html = document.querySelector('.message_text');
const switch_html = document.querySelector('.switch');
let board = [];
let opened = [];
let board_html_container = [];
let game_stop = false;
let flag = false;

for (let i = 0; i < 10; i++) {
    let alt = [];
    for (let j = 0; j < 10; j++) {
        alt.push(0);
    }
    board.push(alt);
}
for (let i = 0; i < 10; i++) {
    let alt = [];
    for (let j = 0; j < 10; j++) {
        alt.push(0);
    }
    opened.push(alt);
}

let alt_1 = 0;
while (alt_1 < bomb) {
    let r = Math.floor(Math.random() * 10);
    let c = Math.floor(Math.random() * 10);
    if (board[r][c] != '爆') {
        board[r][c] = '爆';
        alt_1++;
    }
}

let rshift = [-1, -1, -1, 0, 0, 1, 1, 1];
let cshift = [-1, 0, 1, -1, 1, -1, 0, 1];
for (let i = 0; i < 10; i++) {
    for (let j = 0; j < 10; j++) {
        if (board[i][j] == '爆') {
            continue;
        }
        let bomb_detect = 0;
        for (let k = 0; k < 8; k++) {
            if (i + rshift[k] >= 0 && i + rshift[k] <= 9
             && j + cshift[k] >= 0 && j + cshift[k] <= 9
             && board[i + rshift[k]][j + cshift[k]] == '爆') {
                bomb_detect++;
            }
        }
        board[i][j] = bomb_detect;
    }
}

for (let i = 0; i < 10; i++) {
    let row_html = document.createElement('div');
    row_html.classList.add('row');
    row_html.classList.add(`row_${i}`);
    let alt = [];
    for (let j = 0; j < 10; j++) {
        let column_html = document.createElement('div');
        column_html.innerHTML = board[i][j];
        column_html.classList.add('square');
        column_html.classList.add('hidden');
        column_html.classList.add(`column_${j}`);
        column_html.classList.add(`square_${i}_${j}`);
        column_html.addEventListener('click', () => {
            if (!flag) {
                open_square(i, j);
            } else if (flag) {
                flag_square(i, j);
            }
        });
        row_html.appendChild(column_html);
        alt.push(column_html);
    }
    board_html.appendChild(row_html);
    board_html_container.push(alt);
}

let minimum = 8;
for (let i = 0; i < 10; i++) {
    for (let j = 0; j < 10; j++) {
        if (board[i][j] != '爆' && board[i][j] < minimum) {
            minimum = board[i][j];
        }
    }
}
let initial_open = false;
while (!initial_open) {
    let r = Math.floor(Math.random() * 10);
    let c = Math.floor(Math.random() * 10);
    if (board[r][c] == minimum) {
        open_square(r, c);
        initial_open = true;
    }
}

function open_square(row, column) {
    if (opened[row][column] == 0 && !game_stop) {
        opened[row][column] = 1;
        board_html_container[row][column].classList.remove('hidden');
        if (board[row][column] == '爆') {
            game_stop = true;
            message_html.style.display = 'block';
        }
        let hidden_number = 0;
        for (let i = 0; i < 10; i++) {
            for (let j = 0; j < 10; j++) {
                if (opened[i][j] == 0) {
                    hidden_number++;
                }
            }
        }
        if (hidden_number == bomb) {
            game_stop = true;
            message_html.style.display = 'block';
            message_text_html.style.color = 'red';
            message_text_html.innerHTML = 'GAME CLEAR';
        }
    }
}

function flag_square(row, column) {
    if (opened[row][column] == 0 && !game_stop) {
        board_html_container[row][column].classList.toggle('flagged');
    }
}

function flag_switch() {
    if (!game_stop) {
        switch_html.classList.toggle('on');
        flag = !flag;
    }
}

</script>
</body>
</html>
